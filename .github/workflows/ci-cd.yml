name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop, rupak ]
  pull_request:
    branches: [ main, develop ]

jobs:
  detect-changes:
    name: Detect Changed Services
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.detect.outputs.services }}
      has-changes: ${{ steps.detect.outputs.has-changes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed services
        id: detect
        run: |
          # Get changed files
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            CHANGED_FILES=$(git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.sha }})
          else
            CHANGED_FILES=$(git diff --name-only HEAD^ HEAD)
          fi
          
          echo "Changed files:"
          echo "$CHANGED_FILES"
          
          # Initialize array for changed services
          SERVICES=()
          
          # Check each service
          if echo "$CHANGED_FILES" | grep -q "^services/user-service/"; then
            SERVICES+=("user-service")
          fi
          if echo "$CHANGED_FILES" | grep -q "^services/campaign-service/"; then
            SERVICES+=("campaign-service")
          fi
          if echo "$CHANGED_FILES" | grep -q "^services/pledge-service/"; then
            SERVICES+=("pledge-service")
          fi
          if echo "$CHANGED_FILES" | grep -q "^services/payment-service/"; then
            SERVICES+=("payment-service")
          fi
          if echo "$CHANGED_FILES" | grep -q "^services/notification-service/"; then
            SERVICES+=("notification-service")
          fi
          if echo "$CHANGED_FILES" | grep -q "^services/admin-service/"; then
            SERVICES+=("admin-service")
          fi
          if echo "$CHANGED_FILES" | grep -q "^services/api-gateway/"; then
            SERVICES+=("api-gateway")
          fi
          if echo "$CHANGED_FILES" | grep -q "^shared/"; then
            # If shared code changed, rebuild all services
            SERVICES=("user-service" "campaign-service" "pledge-service" "payment-service" "notification-service" "admin-service" "api-gateway")
          fi
          
          # Convert array to JSON
          SERVICES_JSON=$(printf '%s\n' "${SERVICES[@]}" | jq -R . | jq -s .)
          echo "services=$SERVICES_JSON" >> $GITHUB_OUTPUT
          
          # Check if any services changed
          if [ ${#SERVICES[@]} -gt 0 ]; then
            echo "has-changes=true" >> $GITHUB_OUTPUT
          else
            echo "has-changes=false" >> $GITHUB_OUTPUT
          fi

  test-services:
    name: Test Changed Services
    needs: detect-changes
    if: needs.detect-changes.outputs.has-changes == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.services) }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: services/${{ matrix.service }}/package-lock.json

      - name: Install shared dependencies
        working-directory: ./shared
        run: npm install

      - name: Install service dependencies
        working-directory: ./services/${{ matrix.service }}
        run: npm install

      - name: Run tests
        working-directory: ./services/${{ matrix.service }}
        run: npm test || echo "No tests configured"

      - name: Run linter
        working-directory: ./services/${{ matrix.service }}
        run: npm run lint || echo "No linter configured"

  build-and-push:
    name: Build and Push Docker Images
    needs: [detect-changes, test-services]
    if: |
      needs.detect-changes.outputs.has-changes == 'true' &&
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.services) }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract version from package.json
        id: version
        run: |
          VERSION=$(node -p "require('./services/${{ matrix.service }}/package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./services/${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/careforall-${{ matrix.service }}:latest
            ${{ secrets.DOCKER_USERNAME }}/careforall-${{ matrix.service }}:v${{ steps.version.outputs.version }}
            ${{ secrets.DOCKER_USERNAME }}/careforall-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Environment
    needs: [detect-changes, build-and-push]
    if: |
      needs.detect-changes.outputs.has-changes == 'true' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy with Docker Compose
        run: |
          echo "Deploying to production environment..."
          # In real scenario, this would deploy to a server
          # docker-compose -f docker-compose.prod.yml up -d
          echo "Deployment simulated successfully"

  notification:
    name: Send Notification
    needs: [test-services, build-and-push]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Notify on success
        if: needs.test-services.result == 'success' && needs.build-and-push.result == 'success'
        run: echo "✅ CI/CD Pipeline completed successfully"

      - name: Notify on failure
        if: needs.test-services.result == 'failure' || needs.build-and-push.result == 'failure'
        run: |
          echo "❌ CI/CD Pipeline failed"
          exit 1
