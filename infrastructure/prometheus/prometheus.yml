global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'api-gateway'
    static_configs:
      - targets: ['api-gateway:3000']

  - job_name: 'user-service'
    static_configs:
      - targets: ['user-service:3001']

  - job_name: 'campaign-service'
    static_configs:
      - targets: ['campaign-service:3002']

  - job_name: 'pledge-service'
    static_configs:
      - targets: ['pledge-service:3003']

  - job_name: 'payment-service'
    static_configs:
      - targets: ['payment-service:3004']

  - job_name: 'notification-service'
    static_configs:
      - targets: ['notification-service:3005']

  - job_name: 'admin-service'
    static_configs:
      - targets: ['admin-service:3006']

  - job_name: 'mongodb'
    static_configs:
      - targets: ['mongodb:27017']

  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']
